name: waf
services:
  waf:
    environment:
      BACKEND: http://web:3000
      BLOCKING_PARANOIA: "1"
      MODSEC_RULE_ENGINE: 'On'
    image: owasp/modsecurity-crs:nginx
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8080
        published: "8080"
        protocol: tcp
  web:
    image: bkimminich/juice-shop
    networks:
      default: null
    ports:
      - mode: ingress
        target: 3000
        published: "3000"
        protocol: tcp
networks:
  default:
    name: waf_default
